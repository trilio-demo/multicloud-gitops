---
# dr-backup.yaml
#
# Creates a Trilio BackupPlan for the target namespace, triggers a Backup CR,
# and polls until the Backup reaches Available (success) or Failed.
#
# Trilio CRs involved:
#   BackupPlan  - defines WHAT to back up (namespace scope, retention, Target)
#   Backup      - triggers an actual backup run against a BackupPlan
#   Target      - points to S3/NFS storage (must already exist)
#
# Usage:
#   ansible-playbook ansible/playbooks/dr-backup.yaml \
#     -e target_namespace=my-app \
#     -e backup_name=my-app-backup-01 \
#     -e s3_target=my-s3-target
#
# Required variables:
#   target_namespace:  namespace to back up
#   backup_name:       name for both the BackupPlan and Backup CRs
#   s3_target:         name of an existing Trilio Target CR in trilio_namespace
#
# Optional variables:
#   trilio_namespace:  namespace where Trilio is installed (default: trilio-system)
#   backup_namespace:  namespace where BackupPlan/Backup CRs are created (default: target_namespace)
#   retention_days:    days to retain backups (default: 7)
#   timeout_seconds:   polling timeout in seconds (default: 1800)

- name: Trigger Trilio DR backup
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    trilio_namespace: trilio-system
    backup_namespace: "{{ target_namespace }}"
    retention_days: 7
    timeout_seconds: 1800
    backupplan_name: "{{ backup_name }}-plan"

  pre_tasks:
    - name: Assert required variables are set
      ansible.builtin.assert:
        that:
          - target_namespace is defined
          - backup_name is defined
          - s3_target is defined
        fail_msg: "Required variables missing: target_namespace, backup_name, s3_target"

  tasks:

    # -------------------------------------------------------------------------
    # 1. Run pre-flight validation first
    # -------------------------------------------------------------------------
    - name: Confirm Trilio is healthy before attempting backup
      ansible.builtin.include_tasks: _validate_trilio_ready.yaml

    # -------------------------------------------------------------------------
    # 2. Verify the Target exists and is Available
    # -------------------------------------------------------------------------
    - name: Get Trilio Target CR
      kubernetes.core.k8s_info:
        api_version: triliovault.trilio.io/v1
        kind: Target
        name: "{{ s3_target }}"
        namespace: "{{ trilio_namespace }}"
      register: target_result
      failed_when: >
        target_result.resources | length == 0 or
        (target_result.resources[0].status.status | default('')) != 'Available'

    - name: Show Target status
      ansible.builtin.debug:
        msg: "Target {{ s3_target }} is Available."

    # -------------------------------------------------------------------------
    # 3. Create BackupPlan CR
    #    BackupPlan defines WHAT to protect: which namespace, which storage Target,
    #    and retention policy. It is re-usable across multiple Backup runs.
    # -------------------------------------------------------------------------
    - name: Create BackupPlan CR for namespace {{ target_namespace }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: triliovault.trilio.io/v1
          kind: BackupPlan
          metadata:
            name: "{{ backupplan_name }}"
            namespace: "{{ backup_namespace }}"
          spec:
            backupConfig:
              target:
                name: "{{ s3_target }}"
                namespace: "{{ trilio_namespace }}"
              retentionConfig:
                latest: "{{ retention_days }}"
                weekly: 4
                dayOfWeek: Sunday
                monthly: 3
                dateOfMonth: 1
                yearly: 1
                dateOfYear: April 1st
              scheduleConfig:
                enabled: false
            backupComponents:
              - namespace: "{{ target_namespace }}"
      register: backupplan_result

    - name: Wait for BackupPlan to be Available
      kubernetes.core.k8s_info:
        api_version: triliovault.trilio.io/v1
        kind: BackupPlan
        name: "{{ backupplan_name }}"
        namespace: "{{ backup_namespace }}"
      register: bp_status
      until: >
        bp_status.resources | length > 0 and
        (bp_status.resources[0].status.status | default('')) == 'Available'
      retries: "{{ (timeout_seconds | int / 10) | int }}"
      delay: 10
      failed_when: >
        bp_status.resources | length == 0 or
        (bp_status.resources[0].status.status | default('')) == 'Failed'

    - name: Show BackupPlan status
      ansible.builtin.debug:
        msg: "BackupPlan {{ backupplan_name }} is Available."

    # -------------------------------------------------------------------------
    # 4. Create Backup CR
    #    A Backup CR references a BackupPlan and triggers a single backup run.
    #    Each run creates a new point-in-time snapshot of the namespace.
    # -------------------------------------------------------------------------
    - name: Create Backup CR for {{ backup_name }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: triliovault.trilio.io/v1
          kind: Backup
          metadata:
            name: "{{ backup_name }}"
            namespace: "{{ backup_namespace }}"
          spec:
            backupPlan:
              name: "{{ backupplan_name }}"
              namespace: "{{ backup_namespace }}"
            type: Full
      register: backup_result

    - name: Show Backup CR created
      ansible.builtin.debug:
        msg: "Backup CR {{ backup_name }} created. Waiting for completion..."

    # -------------------------------------------------------------------------
    # 5. Poll Backup status until Available (success) or Failed
    # -------------------------------------------------------------------------
    - name: Wait for Backup to complete
      kubernetes.core.k8s_info:
        api_version: triliovault.trilio.io/v1
        kind: Backup
        name: "{{ backup_name }}"
        namespace: "{{ backup_namespace }}"
      register: backup_status
      until: >
        backup_status.resources | length > 0 and
        (backup_status.resources[0].status.status | default('')) in ['Available', 'Failed']
      retries: "{{ (timeout_seconds | int / 10) | int }}"
      delay: 10

    - name: Assert Backup succeeded
      ansible.builtin.assert:
        that:
          - backup_status.resources[0].status.status == 'Available'
        fail_msg: >
          Backup {{ backup_name }} FAILED.
          Status: {{ backup_status.resources[0].status | to_nice_json }}
        success_msg: >
          PASS: Backup {{ backup_name }} completed successfully.
          Size: {{ backup_status.resources[0].status.size | default('unknown') }}
          Location: {{ backup_status.resources[0].status.backupLocation | default('unknown') }}
