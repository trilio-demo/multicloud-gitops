apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trilio-license
  namespace: trilio-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: trilio-license
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # 5.2.x License Job reads data.key (raw key, K8s base64-encodes once)
        key: "{{ `{{ .trilio_license_key }}` }}"
        # 5.3.x webhook reads data.trilioLicense expecting base64(raw_key) when decoded.
        # b64enc adds one extra encoding layer so K8s stores base64(base64(raw_key));
        # decoded once by K8s gives base64(raw_key) which is what 5.3.x validates.
        trilioLicense: "{{ `{{ .trilio_license_key | b64enc }}` }}"
  data:
    - secretKey: trilio_license_key
      remoteRef:
        key: secret/global/trilio-license
        property: key
